<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-hidden="true">
  <!-- Манул-космонавт — символ Финансового университета, перерисованный
       по образцу вуза (использование согласовано, по словам автора проекта,
       21.09.2026). Векторная копия: шлем, синий скафандр с розовым значком,
       нашивка-лапка, полосатый хвост, ботинки с розовыми подошвами. -->
  <defs>
    <clipPath id="helmet"><circle cx="112" cy="70" r="52"/></clipPath>
  </defs>
  <g stroke="#2b3550" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- хвост: серый с тёмными шевронами, поднят слева -->
    <path d="M62 170 C40 168 22 150 24 122 C25 108 32 96 46 94 C54 93 60 98 62 106 C64 116 56 122 48 122 C44 132 46 146 58 152Z" fill="#9c9691"/>
    <path d="M44 98 C40 104 38 110 38 116" fill="none" stroke="#4c4a4c" stroke-width="9"/>
    <path d="M30 126 C32 134 36 140 40 144" fill="none" stroke="#4c4a4c" stroke-width="9"/>
    <path d="M40 152 C46 158 52 162 60 164" fill="none" stroke="#4c4a4c" stroke-width="9"/>
    <path d="M56 106 C58 114 56 120 50 122" fill="none" stroke="#4c4a4c" stroke-width="6"/>
    <!-- тело: серо-бежевое, пушистое -->
    <path d="M62 178 C56 150 60 122 82 108 C96 100 120 100 138 108 C160 118 170 146 168 178 Z" fill="#a89b8a"/>
    <!-- скафандр: синий комбинезон, тёмные плечи -->
    <path d="M78 116 C88 106 132 106 146 116 C160 126 164 150 160 168 L124 166 L118 178 L100 178 L96 166 L74 166 C70 150 70 128 78 116 Z" fill="#4b6db1"/>
    <path d="M78 116 C86 108 132 108 146 116 C150 122 152 130 150 134 L74 134 C72 128 74 120 78 116 Z" fill="#3a5490" stroke="none"/>
    <!-- воротник -->
    <path d="M86 116 C96 110 128 110 140 116 C134 124 92 124 86 116 Z" fill="#2e4478" stroke="none"/>
    <!-- молния -->
    <path d="M118 128 L118 150" stroke="#2b3550" stroke-width="4"/>
    <path d="M116 132 L120 132 M116 138 L120 138 M116 144 L120 144" stroke="#7f9bd6" stroke-width="2"/>
    <!-- розовый значок на груди -->
    <rect x="102" y="120" width="26" height="14" rx="3" fill="#ec8489"/>
    <!-- нашивка-лапка на плече -->
    <circle cx="150" cy="140" r="9" fill="#2e4478"/>
    <g fill="#ec8489" stroke="none">
      <circle cx="150" cy="142" r="3.2"/><circle cx="146" cy="138" r="1.6"/><circle cx="150" cy="136" r="1.6"/><circle cx="154" cy="138" r="1.6"/>
    </g>
    <!-- передние лапы в рукавах с полосатыми манжетами -->
    <rect x="96" y="150" width="20" height="26" rx="6" fill="#4b6db1"/>
    <rect x="122" y="150" width="20" height="26" rx="6" fill="#4b6db1"/>
    <path d="M96 158 H116 M96 166 H116 M122 158 H142 M122 166 H142" stroke="#c7d6ee" stroke-width="4"/>
    <!-- ботинки с розовой подошвой -->
    <path d="M94 176 C92 186 96 190 106 190 C116 190 120 186 118 176 Z" fill="#3d4a8e"/>
    <path d="M120 176 C118 186 122 190 132 190 C142 190 146 186 144 176 Z" fill="#3d4a8e"/>
    <path d="M96 186 C100 190 112 190 116 186" fill="none" stroke="#ec8489" stroke-width="4"/>
    <path d="M122 186 C126 190 138 190 142 186" fill="none" stroke="#ec8489" stroke-width="4"/>
    <!-- задние лапы с розовыми подушечками -->
    <ellipse cx="76" cy="182" rx="16" ry="10" fill="#4b5fa0"/>
    <ellipse cx="156" cy="180" rx="16" ry="10" fill="#4b5fa0"/>
    <g fill="#ec8489" stroke="none">
      <ellipse cx="76" cy="184" rx="5" ry="3.5"/><circle cx="70" cy="179" r="1.8"/><circle cx="76" cy="177" r="1.8"/><circle cx="82" cy="179" r="1.8"/>
      <ellipse cx="156" cy="182" rx="5" ry="3.5"/><circle cx="150" cy="177" r="1.8"/><circle cx="156" cy="175" r="1.8"/><circle cx="162" cy="177" r="1.8"/>
    </g>
    <!-- голова внутри шлема -->
    <g clip-path="url(#helmet)">
      <ellipse cx="112" cy="84" rx="41" ry="32" fill="#b9ab98"/>
      <!-- уши -->
      <path d="M78 68 C74 56 84 52 92 60 Z" fill="#b9ab98"/>
      <path d="M146 68 C150 56 140 52 132 60 Z" fill="#b9ab98"/>
      <path d="M80 66 C79 60 84 58 89 62 Z" fill="#d9c8b2" stroke="none"/>
      <path d="M144 66 C145 60 140 58 135 62 Z" fill="#d9c8b2" stroke="none"/>
      <!-- пятна на лбу -->
      <g fill="#4a5470" stroke="none">
        <circle cx="104" cy="62" r="2.4"/><circle cx="112" cy="58" r="2.4"/><circle cx="120" cy="62" r="2.4"/>
        <circle cx="108" cy="67" r="1.8"/><circle cx="116" cy="67" r="1.8"/><circle cx="112" cy="72" r="1.6"/>
      </g>
      <!-- тёмные штрихи под глазами и на щеках -->
      <path d="M88 84 C92 82 96 82 100 84" fill="none" stroke="#4a5470" stroke-width="4"/>
      <path d="M124 84 C128 82 132 82 136 84" fill="none" stroke="#4a5470" stroke-width="4"/>
      <path d="M80 96 C82 100 84 104 88 106 M84 92 C86 96 88 100 92 102" fill="none" stroke="#4a5470" stroke-width="3"/>
      <path d="M144 96 C142 100 140 104 136 106 M140 92 C138 96 136 100 132 102" fill="none" stroke="#4a5470" stroke-width="3"/>
      <!-- глаза: зеленовато-серые, с бликом -->
      <ellipse cx="98" cy="88" rx="7" ry="8" fill="#fff" stroke-width="2.4"/>
      <ellipse cx="126" cy="88" rx="7" ry="8" fill="#fff" stroke-width="2.4"/>
      <ellipse cx="98.5" cy="89" rx="4.6" ry="5.6" fill="#8fa37a" stroke="none"/>
      <ellipse cx="126.5" cy="89" rx="4.6" ry="5.6" fill="#8fa37a" stroke="none"/>
      <circle cx="99" cy="90" r="2.4" fill="#1b2230" stroke="none"/>
      <circle cx="127" cy="90" r="2.4" fill="#1b2230" stroke="none"/>
      <circle cx="101" cy="86.5" r="1.3" fill="#fff" stroke="none"/>
      <circle cx="129" cy="86.5" r="1.3" fill="#fff" stroke="none"/>
      <!-- нос и улыбка -->
      <path d="M109 98 L115 98 L112 102 Z" fill="#2b3550"/>
      <path d="M112 102 C112 106 106 108 102 106 M112 102 C112 106 118 108 122 106" fill="none" stroke-width="2.6"/>
      <!-- усы -->
      <path d="M92 94 L78 90 M92 99 L78 100 M132 94 L146 90 M132 99 L146 100" stroke-width="1.8"/>
    </g>
    <!-- шлем: стеклянный купол с ушками и бликами -->
    <circle cx="112" cy="70" r="52" fill="#dfe7ee" fill-opacity="0.55"/>
    <path d="M66 46 C60 34 72 28 80 38 Z" fill="#e9eef3"/>
    <path d="M158 46 C164 34 152 28 144 38 Z" fill="#e9eef3"/>
    <path d="M80 36 C92 24 128 22 146 40" fill="none" stroke="#fff" stroke-width="5" stroke-opacity="0.9"/>
    <circle cx="150" cy="54" r="5" fill="#fff" stroke="none"/>
    <path d="M76 108 C84 122 140 122 148 108" fill="#3a5490" stroke="#2b3550" stroke-width="3"/>
  </g>
</svg>
